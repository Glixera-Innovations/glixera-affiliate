# fly.toml app configuration file generated for glixera-affiliate on 2026-08-17T21:17:34Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'glixera-affiliate'
primary_region = 'ams'
kill_signal = 'SIGINT'
kill_timeout = '10s'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATA_DIR = '/data'
  NODE_ENV = 'production'
  PORT = '8080'
  TIME_ZONE = 'Europe/Brussels'

[[mounts]]
  source = 'affiliate_data'
  destination = '/data'
  initial_size = '1GB'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '20s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    timeout = '5s'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
